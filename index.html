    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {

    }
    h1 {

      margin-bottom: 1rem;
      color: #1a73e8;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    a {
      text-decoration: none;

      border-radius: 5px;
      background-color: #1a73e8;
      color: #fff;
      transition: background-color 0.3s ease;

    a:hover {

    }
    nav a {
